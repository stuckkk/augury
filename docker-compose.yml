services:
  augury:
    build: .
    image: augury
    ports:
      - "8080:8080"
    environment:
      # Running games are saved here on shutdown and restored on start.
      SNAPSHOT_FILE: /data/rooms.json
      # Set to 1 when running behind a reverse proxy (uses X-Forwarded-For for rate limits).
      TRUST_PROXY: "0"
    volumes:
      - augury-data:/data
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  augury-data:
